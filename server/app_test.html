<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앱 연결 테스트 | AR Evacuate</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#203c35;font:16px/1.7 'Segoe UI','Malgun Gothic',sans-serif}main{max-width:860px;margin:36px auto;padding:24px}header{margin-bottom:25px}small{color:#387565;font-size:14px}h1{font-size:29px;margin:6px 0}p{color:#657f75;margin:7px 0 18px}section{background:#fff;border:1px solid #dce8e2;border-radius:14px;padding:23px;margin:18px 0}h2{font-size:20px;margin:0 0 10px}button{background:#147c68;border:0;color:#fff;border-radius:8px;padding:11px 17px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #8bd1b9;outline-offset:3px}.status{font-size:15px;margin-top:15px}.error{color:#a13c34}ul{padding:0;list-style:none}li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #edf2ee}li span{overflow-wrap:anywhere}li button{font-size:14px;white-space:nowrap;background:#edf6f1;color:#216f55;border:1px solid #d6e9dd}img{max-width:100%;max-height:480px;display:block;margin:15px auto;object-fit:contain}code{font-size:14px;background:#eef4f0;padding:2px 5px;overflow-wrap:anywhere}.note{font-size:14px}#photo-section[hidden]{display:none}</style></head>
<body><main><header><small>AR Evacuate · 앱 조회 API 확인</small><h1>앱 연결 테스트</h1><p>친구의 앱이 사용할 것과 같은 API로 장소와 사진을 불러와요.</p><code id="address"></code></header>
<section><h2>서버 연결과 장소 목록</h2><button id="load" type="button">장소 목록 불러오기</button><div id="status" class="status" role="status" aria-live="polite">버튼을 눌러 연결을 확인해 주세요.</div><ul id="places"></ul></section>
<section id="photo-section" hidden><h2 id="photo-title">출입문 사진</h2><p id="photo-status" role="status"></p><img id="photo" alt="선택한 장소의 출입문" hidden></section>
<p class="note">조회 테스트 화면이에요. 여기서는 장소나 사진을 수정·삭제할 수 없어요. 등록된 사진은 현재 위치를 자동으로 확인하는 기능이 아니에요.</p></main>
<script>
const loadButton=document.getElementById('load'),statusLine=document.getElementById('status'),list=document.getElementById('places'),section=document.getElementById('photo-section'),image=document.getElementById('photo'),photoStatus=document.getElementById('photo-status');
document.getElementById('address').textContent=location.origin;
let photoVersion=0;
loadButton.addEventListener('click',async()=>{loadButton.disabled=true;list.replaceChildren();section.hidden=true;image.hidden=true;photoVersion++;statusLine.classList.remove('error');statusLine.textContent='서버에서 불러오는 중이에요.';try{const health=await fetch('/api/app/status',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!health.ok)throw new Error('서버에 연결하지 못했어요.');const response=await fetch('/api/app/places',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('장소 목록을 불러오지 못했어요.');const data=await response.json();statusLine.textContent=`연결 성공 · 사용할 수 있는 장소 ${data.count}개`;
for(const place of data.places){const row=document.createElement('li'),label=document.createElement('span');label.textContent=`${place.building} · ${place.floor} · ${place.room}`;row.append(label);if(place.hasPhoto&&place.photoUrl){const button=document.createElement('button');button.type='button';button.textContent='사진 보기';button.setAttribute('aria-label',`${place.building} ${place.floor} ${place.room} 사진 보기`);button.addEventListener('click',()=>{const version=++photoVersion;section.hidden=false;image.hidden=true;document.getElementById('photo-title').textContent=`${place.room} 출입문 사진`;photoStatus.textContent='사진을 불러오는 중이에요.';image.onload=()=>{if(version!==photoVersion)return;image.hidden=false;photoStatus.textContent='서버 사진 불러오기 완료';};image.onerror=()=>{if(version!==photoVersion)return;image.hidden=true;photoStatus.textContent='사진을 불러오지 못했어요. 장소 목록을 다시 확인해 주세요.';};image.alt=`${place.building} ${place.floor} ${place.room} 출입문`;image.src=place.photoUrl;section.scrollIntoView({behavior:'smooth',block:'start'});});row.append(button);}else{const text=document.createElement('small');text.textContent='등록된 사진 없음';row.append(text);}list.append(row);}
}catch(error){statusLine.classList.add('error');statusLine.textContent='연결 실패 · 서버 실행과 주소를 확인한 뒤 다시 시도해 주세요.';}finally{loadButton.disabled=false;}});
</script></body></html>
